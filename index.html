<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Charts</title><link rel="shortcut icon" href="./favicon.ico"/><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/><script src="https://canadian-geospatial-platform.github.io/geoview/public/cgpv-main.js"></script><style>/* To help with display */
      .MuiGrid-container {
        width: 900px;
      }</style><script defer="defer" src="main.js"></script></head><body><div style="text-align: center;"><div style="display:inline-block; background-color: lightgreen; width: 49%; vertical-align:top;"><div style="text-align: left;">GEOCHART INPUTS <span style="font-size: small;">(these parameters will be parsed and sent to the Chart.js props on the right and GeoChart created below)</span></div><div style="margin-bottom: 5px;"><span>Language: </span><select id="lang" onchange="languageChanged()"><option selected="selected" value="en">English</option><option value="fr">Français</option></select></div><div><div style="margin-bottom: 10px;"><span>Chart Config: </span><select id="selChart"><option value="./configs/config-line-1.json">Import Chart time complete</option><option value="./configs/config-line-2.json">Import Chart time log. tension</option><option value="./configs/config-line-2-slim.json">Import Chart no sliders</option><option value="./configs/config-line-ogc-1.json">Imp. OGC Line (VPN)</option><option value="./configs/config-bar-1.json">Imp. OGC Bar (all)</option><option value="./configs/config-bar-1-single.json">Imp. OGC Bar (single)</option><option value="./configs/config-bar-2.json">Import Data BAR</option><option value="./configs/config-pie-1.json">Import Data PIE</option><option value="./configs/config-doughnut-1.json">Import Data DOUGHNUT</option><option value="./configs/config-bar-3.json">Import Data BAR simple</option><option value="./configs/config-line-4.json">Import Data w/ nulls</option><option value="./configs/config-line-5.json">Import Data test apostrophes</option></select></div><div><textarea id="CHARTDATAINPUTS" rows="18" style="width: 98%;"></textarea></div></div><div><button onclick="loadChartFromInputs()" style="padding:5px;"><strong>BUILD CHART FROM GEOCHART INPUTS</strong></button></div></div><div style="display:inline-block; background-color: aliceblue; width: 50%; vertical-align:top;"><div style="text-align: left;">CHART.JS PROPS <span style="font-size: small;">(these Chart.js native parameters are used to draw the actual chart itself)</span></div><div style="padding:10px;"><select id="CHARTTYPE"><option value="line" selected="selected">Line</option><option value="bar">Bar</option><option value="pie">Pie</option><option value="doughnut">Doughnut</option></select></div><div><div style="display:inline-block; width: 49%;"><div><button onclick="importNativeOptionsParsed('./configs/native-options-1.json')">Import Options (default)</button> <button onclick="importNativeOptionsParsed('./configs/native-options-2.json')">Import Options dummy scale</button></div><div><textarea id="CHARTOPTIONSPARSED" rows="18" style="width: 98%"></textarea></div></div><div style="display:inline-block; width: 49%;"><div><button onclick="importNativeDataParsed('./configs/native-data-1.json')">Import Data 1 rec</button> <button onclick="importNativeDataParsed('./configs/native-data-2.json')">Import Data 2 recs</button> <button onclick="importNativeDataParsed('./configs/native-data-3.json')">Import Data 2 recs w/ steps</button> <button onclick="importNativeDataParsed('./configs/native-data-4.json')">Import Data using x,y</button></div><div><textarea id="CHARTDATAPARSED" rows="18" style="width: 98%"></textarea></div></div></div><div><button onclick="loadChartFromNative()" style="padding:5px;"><strong>BUILD CHART FROM CHART.JS PROPS</strong></button></div></div></div><div id="root2aca7b6b288c" style="position: relative;"></div><div><button onclick="redrawChart()" style="padding:5px;"><strong>Looks weird? Redraw!</strong></button> <button onclick="isLoadingState(1)" style="padding:5px;"><strong>Sim. loading whole chart</strong></button> <button onclick="isLoadingState(2)" style="padding:5px;"><strong>Sim. lazy loading of datasource</strong></button> <button onclick="isLoadingState(0)" style="padding:5px;"><strong>Clear loading sim.</strong></button></div><script>async function importChartConfig(inputPath) {
        // Fetch the json
        const result = await fetch(inputPath);
        const body = await result.json();

        // Load
        document.getElementById('CHARTDATAINPUTS').value = JSON.stringify(body, null, 2);
      }

      async function importNativeDataParsed(inputPath) {
        // Fetch the json
        const result = await fetch(inputPath);
        const body = await result.json();

        // Load
        document.getElementById('CHARTDATAPARSED').value = JSON.stringify(body, null, 2);
      }

      async function importNativeOptionsParsed(inputPath) {
        // Fetch the json
        const result = await fetch(inputPath);
        const body = await result.json();

        // Load
        document.getElementById('CHARTOPTIONSPARSED').value = JSON.stringify(body, null, 2);
      }

      function loadChartFromInputs() {
        let chartInputs = null;

        try {
          if (document.getElementById('CHARTDATAINPUTS').value)
            chartInputs = JSON.parse(document.getElementById('CHARTDATAINPUTS').value);
        }
        catch (ex) {
          alert('Failed to create JSON from input data text area.');
          console.error(ex);
        }

        // Emit a Chart Changed event so the chart updates
        // This is not using the conventional way to communicate with the Chart. It simulates a ReactJS behavior.
        window.dispatchEvent(new CustomEvent("chart/load", { detail: { inputs: chartInputs } }));
      }

      function loadChartFromNative() {
        let chartType = document.getElementById('CHARTTYPE').value || 'line';
        let chartData = null;
        let chartOptions = null;

        try {
          if (document.getElementById('CHARTDATAPARSED').value)
            chartData = JSON.parse(document.getElementById('CHARTDATAPARSED').value);
        }
        catch (ex) {
          alert('Failed to create JSON from input data text area.');
          console.error(ex);
        }
        try {
          if (document.getElementById('CHARTOPTIONSPARSED').value)
            chartOptions = JSON.parse(document.getElementById('CHARTOPTIONSPARSED').value);
        }
        catch (ex)  {
          alert('Failed to create JSON from input options text area.');
          console.error(ex);
        }

        // Emit a Chart Changed event so the chart updates
        // This is not using the conventional way to communicate with the Chart. It simulates a ReactJS behavior.
        window.dispatchEvent(new CustomEvent("chart/load", { detail: { chart: chartType, data: chartData, options: chartOptions } }));
      }

      function redrawChart() {
        // Emit a Chart Redraw event so the chart updates
        // This is not using the conventional way to communicate with the Chart. It simulates a ReactJS behavior.
        window.dispatchEvent(new CustomEvent("chart/redraw"));
      }

      function languageChanged() {
        // Emit a Chart Language changed event so the chart updates
        // This is not using the conventional way to communicate with the Chart. It simulates a ReactJS behavior.
        window.dispatchEvent(new CustomEvent("chart/language", { detail: { language: event.target.value } }));
      }

      async function chartChanged(event) {
        // Import the chart config
        await importChartConfig(event.target.value);
        // Also immediately build the chart
        loadChartFromInputs();
      }

      function isLoadingState(state) {
        // Emit a Chart Redraw event so the chart updates
        // This is not using the conventional way to communicate with the Chart. It simulates a ReactJS behavior.
        window.dispatchEvent(new CustomEvent("chart/isLoading", { detail: { state: state } }));
      }

      function handleChartLoaded(e) {
        // Update ui
        document.getElementById('CHARTTYPE').value = e.detail.chart;
        document.getElementById('CHARTOPTIONSPARSED').value = JSON.stringify(e.detail.options, null, 2);
        document.getElementById('CHARTDATAPARSED').value = JSON.stringify(e.detail.data, null, 2);
      }

      // Load data 1
      importChartConfig('./configs/config-line-1.json').then((result) => {
        // Now load the chart
        loadChartFromInputs();
      });

      importNativeOptionsParsed('./configs/native-options-1.json');
      importNativeDataParsed('./configs/native-data-1.json');

      // Attach the event listener
      const selectElement = document.getElementById("selChart");
      selectElement.addEventListener("change", chartChanged);

      // Listen on the chart parsed to update the UI
      window.addEventListener('chart/parsed', handleChartLoaded);</script></body></html>
